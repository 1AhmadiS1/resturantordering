server {
    listen 80;

    client_max_body_size 10M;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /.well-known/acme-challenge/ {
        #  pass all requests for acme challenge to django from the volume certbot_webroot
        root /var/www/certbot;
    }

    location /static/ {
        # pass all requests for static files to django from the volume staticfiles
        alias /app/staticfiles/;
    }
    
    location /media/ {
        # pass all requests for media files to django from the volume mediafiles
        alias /app/mediafiles/;
    }
    
    location / {
        # pass all requests to django to the service named web on port 8000
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        
        # set headers to pass the original request information to django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name restohubapi.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/restohubapi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restohubapi.duckdns.org/privkey.pem;

    client_max_body_size 10M;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}