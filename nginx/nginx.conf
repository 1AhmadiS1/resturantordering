limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name restohubapi.duckdns.org;

    location /.well-known/acme-challenge/ {
        # Let’s Encrypt uses this path to verify the domain.
        root /var/www/certbot;
    }

    location / {
        # Send normal HTTP users to HTTPS.
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name restohubapi.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/restohubapi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restohubapi.duckdns.org/privkey.pem;

    client_max_body_size 10M;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }


    location = /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
