server {
    listen 80;

    client_max_body_size 10M;

    location /static/ {
        # pass all requests for static files to django from the volume staticfiles
        alias /app/staticfiles/;
    }
    
    location /media/ {
        # pass all requests for media files to django from the volume mediafiles
        alias /app/mediafiles/;
    }
    
    location / {
        # pass all requests to django to the service named web on port 8000
        proxy_pass http://web:8000;
        
        # set headers to pass the original request information to django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}